<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*Main form*/
        form{
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f8f9fa;
            border: 1px  solid #999;
            font-family: Arial, sans-serif;
        }
       /* fieldset*/
       fieldset{
        margin-bottom: 15px;
        padding: 15px;
        border: 1px solid #888;
       }
       /* legend */
       legend{
        font-size: 20px;
        font-weight: bold;
        padding: 0 8px;
        color: #333;
       }
       /* fields*/
       input[type="text"],
       input[type="email"],
       input[type="tel"],
       select{
        width: 250px;
        padding: 8px 10px;
        margin-bottom: 8px;
        border: 1px solid #999;
        border-radius: 4px;
        font-size: 15px;
        box-sizing: border-box;
       }
       /* input focus */
       input:focus,
       select:focus {
        outline: none;
        border-color: #555;
       }
       /* Submit Button */
       input[type="submit"]
       button{
        padding: 9px 20px;
        background-color: #333;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 15px;
       }
       /* Button hover */
       input[type="submit"]:hover
       button:hover {
        background-color: #555;
       }
    </style>
</head>
<body>
    <fieldset>
        <fieldset>
        <legend>Personal Information</legend>
        <label for="Fname">FullName:</label>
        <input type="text" name="fname" id="" placeholder="enter your full name"> 
        <br>
        <label for="parentname">parent Name:</label>
        <input type="text" name="parentname" id="" placeholder="enter your parentname">
    </fieldset>
    <fieldset>
        <legend>Contact Details</legend>
        <label for="email">Email:</label>
        <input type="email" name="" id="" placeholder="enter your email"><br>
        <label for="Mobile">Mobile No:</label>
        <input type="text" name="mobile" id="" placeholder="enter nour mobile number">
    </fieldset>
    <fieldset>
        <legend>Additional Info</legend>
        <label for="Food">Food Choice:</label>
        <select name="food" id="">
            <option value="veg">veg</option>
            <option value="non-veg">Non-veg</option>
            <option value="vegan">vegan</option>
        </select>
    </fieldset>
    <br>
    <input type="submit" value="Submit">
    </fieldset>
</body>
</html>
